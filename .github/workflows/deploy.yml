name: CI & Cloudflare Pages Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  repository_dispatch:
    types: [sanity-publish]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Format Check
        if: github.event_name != 'repository_dispatch'
        run: npm run format:check

      - name: Lint
        if: github.event_name != 'repository_dispatch'
        run: npm run lint

      - name: Unit Tests
        if: github.event_name != 'repository_dispatch'
        run: npm run test -- --run

      - name: Build
        run: npm run build
        env:
          PUBLIC_SANITY_PROJECT_ID: ${{ secrets.PUBLIC_SANITY_PROJECT_ID || 'n3mnxpum' }}
          PUBLIC_SANITY_DATASET: ${{ secrets.PUBLIC_SANITY_DATASET || 'production' }}
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL || vars.PUBLIC_SITE_URL || 'https://ukmcoding.site' }}
          PUBLIC_NOINDEX: ${{ github.ref != 'refs/heads/main' && 'true' || 'false' }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  link-check:
    name: Internal Link Check
    needs: build-and-test
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Lychee Link Check
        uses: lycheeverse/lychee-action@v1.9.3
        with:
          args: --offline --no-progress './dist/**/*.html'
          fail: true

  lighthouse:
    name: Lighthouse CI
    needs: build-and-test
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: "./lighthouserc.json"
          uploadArtifacts: true
          temporaryPublicStorage: true

  deploy:
    name: Deploy to Cloudflare Pages
    needs: [build-and-test, link-check, lighthouse]
    if: |
      always() &&
      (github.ref == 'refs/heads/main' || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch') &&
      needs.build-and-test.result == 'success' &&
      (needs.link-check.result == 'success' || needs.link-check.result == 'skipped') &&
      (needs.lighthouse.result == 'success' || needs.lighthouse.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Cloudflare Pages
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing in GitHub Repository Secrets."
            exit 1
          fi

          # Clean accidental quotes, whitespace, or full URLs from Account ID
          CLEAN_ACCOUNT_ID=$(echo "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n"' | sed "s/'//g" | sed 's|.*/||g' | awk '{$1=$1};1')

          if [ -z "$CLEAN_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is missing or empty in GitHub Repository Secrets."
            exit 1
          fi

          if echo "$CLEAN_ACCOUNT_ID" | grep -qE "[@\.]"; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID contains invalid characters ('@' or '.'). It must be the 32-character hexadecimal Account ID from your Cloudflare dashboard (https://dash.cloudflare.com/<ACCOUNT_ID>), not your email address or domain name."
            exit 1
          fi

          export CLOUDFLARE_ACCOUNT_ID="$CLEAN_ACCOUNT_ID"
          npx wrangler pages deploy dist --project-name="${{ vars.CLOUDFLARE_PROJECT_NAME || 'ukm-coding-website' }}" --branch="${{ github.ref == 'refs/heads/main' && 'main' || github.event.pull_request.head.ref || 'preview' }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
